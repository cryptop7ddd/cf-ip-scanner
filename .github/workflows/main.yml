name: Cloudflare IP Auto Setter
on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时运行一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # 升级到最新版本v4

      - name: Setup Node.js
        uses: actions/setup-node@v4 # 升级到最新版本v4
        with:
          node-version: '20' # 使用稳定的Node 20环境

      - name: Run Cloudflare Scan
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        run: |
          # 检查文件是否存在
          if [ -f "script.js" ]; then
            node script.js
          else
            echo "Error: script.js not found!"
            exit 1
          fi

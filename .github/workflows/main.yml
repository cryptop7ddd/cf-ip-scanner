name: Cloudflare IP Auto Setter
on:
  schedule:
    - cron: '0 */6 * * *' # 每6小时自动跑一次
  workflow_dispatch: # 支持手动点击运行

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Run Cloudflare Speed Test
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}
          CF_DOMAIN: ${{ secrets.CF_DOMAIN }}
        run: |
          chmod +x ./script.js
          node ./script.js
